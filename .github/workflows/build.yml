name: Build VPN Client APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Download xray binary otomatis - tidak perlu upload ke GitHub
      - name: Download Xray binary (ARM64)
        run: |
          echo "Mencari versi xray terbaru..."
          LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Xray versi: $LATEST"
          mkdir -p assets
          curl -L -o /tmp/xray-android.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray-android.zip xray -d assets/
          chmod +x assets/xray
          ls -lh assets/
          echo "Xray binary siap!"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Android Gradle Plugin (versi yang dipakai build tools terbaru) butuh
      # Java 17+. Runner ubuntu-22.04 sudah punya JDK 17 terpasang di
      # JAVA_HOME_17_X64 -- kita arahkan JAVA_HOME ke situ untuk sisa job ini,
      # supaya gradlew tidak jatuh balik ke default (Java 11).
      - name: Gunakan Java 17 untuk build
        run: |
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake build-essential \
            ccache libltdl-dev

      - name: Install buildozer & Cython (pinned)
        run: |
          pip install --upgrade pip
          pip install cython==0.29.37
          pip install python-for-android==2024.1.21
          pip install buildozer

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}

      - name: Pastikan pakai python-for-android yang di-pin
        run: |
          rm -rf .buildozer/android/platform/python-for-android

      - name: Build APK (native, Python 3.11)
        run: |
          set -o pipefail
          echo "JAVA_HOME aktif: $JAVA_HOME"
          java -version
          # 'yes' dipakai untuk auto-jawab prompt buildozer. Setelah buildozer
          # selesai (walau SUKSES), 'yes' masih menulis ke pipe yang sudah
          # tertutup -> dia exit dengan error "Broken pipe". GitHub Actions
          # menjalankan step ini dengan `bash -e`, jadi tanpa `|| true`, bash
          # akan langsung berhenti di baris pipeline ini (karena exit code
          # SIGPIPE milik 'yes' dianggap gagal) SEBELUM sempat menjalankan
          # baris `exit ${PIPESTATUS[1]}` di bawahnya. `|| true` mencegah itu,
          # sehingga exit code buildozer yang sebenarnya (indeks ke-1 di
          # PIPESTATUS) yang menentukan sukses/gagalnya step ini.
          yes 2>/dev/null | buildozer -v android debug 2>&1 | tee build.log || true
          exit ${PIPESTATUS[1]}

      - name: Cek APK hasil build
        run: |
          if ls bin/*.apk 2>/dev/null; then
            echo "BUILD BERHASIL!"
            ls -lh bin/*.apk
          else
            echo "APK tidak ditemukan!"
            echo "=== 50 baris terakhir log ==="
            tail -50 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload log build (untuk debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VPN Client Build #${{ github.run_number }}"
          files: bin/*.apk
          body: |
            ## 📱 VPN Client APK
            Build dari commit: `${{ github.sha }}`

            **Cara install:**
            1. Download APK di bawah
            2. Aktifkan instalasi dari sumber tidak dikenal
            3. Install & buka app!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
