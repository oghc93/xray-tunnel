name: Build VPN Client APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Download xray binary otomatis
      - name: Download Xray binary (ARM64)
        run: |
          LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Xray versi: $LATEST"
          mkdir -p assets
          curl -L -o /tmp/xray.zip \
            "{{https://github.com/XTLS/Xray-core/releases/download/${LATEST}}}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray.zip xray -d assets/
          chmod +x assets/xray
          ls -lh assets/

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # PERBAIKAN UTAMA: Pakai tag 'stable' bukan 'latest'
      # latest pakai Python 3.14 yang belum kompatibel dengan Cython
      # stable pakai Python 3.11 yang sudah terbukti jalan
      - name: Build APK dengan Docker Kivy (stable)
        run: |
          docker pull kivy/buildozer:stable
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:stable \
            android debug 2>&1 | tee build.log

      - name: Cek APK hasil build
        run: |
          if ls bin/*.apk 2>/dev/null; then
            echo "BUILD BERHASIL!"
            ls -lh bin/*.apk
          else
            echo "APK tidak ditemukan!"
            tail -80 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VPN Client Build #${{ github.run_number }}"
          files: bin/*.apk
          body: |
            ## ðŸ“± VPN Client APK
            Build dari commit: `${{ github.sha }}`

            **Cara install:**
            1. Download APK di bawah
            2. Aktifkan instalasi dari sumber tidak dikenal
            3. Install & buka app!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
