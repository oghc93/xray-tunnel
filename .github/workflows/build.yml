name: Build VPN Client APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Xray binary (ARM64)
        run: |
          LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Xray versi: $LATEST"
          mkdir -p assets
          curl -L -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray.zip xray -d assets/
          chmod +x assets/xray
          ls -lh assets/

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip wget openjdk-17-jdk \
            build-essential python3-dev \
            autoconf automake libtool pkg-config \
            zlib1g-dev libssl-dev libffi-dev libltdl-dev \
            cmake ccache lld patchelf libc6-i386 lib32stdc++6

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36"
          pip install "buildozer==1.5.0"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Cek APK hasil build
        run: |
          if ls bin/*.apk 2>/dev/null; then
            echo "BUILD BERHASIL!"
            ls -lh bin/*.apk
          else
            echo "APK tidak ditemukan!"
            tail -100 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VPN Client Build #${{ github.run_number }}"
          files: bin/*.apk
          body: |
            ## VPN Client APK
            Build: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
