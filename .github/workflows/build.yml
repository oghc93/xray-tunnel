name: Build VPN Client APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Download xray binary otomatis - tidak perlu upload ke GitHub
      - name: Download Xray binary (ARM64)
        run: |
          echo "Mencari versi xray terbaru..."
          LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Xray versi: $LATEST"
          mkdir -p assets
          curl -L -o /tmp/xray-android.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-android-arm64-v8a.zip"
          unzip -o /tmp/xray-android.zip xray -d assets/
          chmod +x assets/xray
          ls -lh assets/
          echo "Xray binary siap!"

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      # Pakai Docker Kivy - cara paling reliable untuk build APK Kivy
      - name: Build APK dengan Docker Kivy
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log

      - name: Cek APK hasil build
        run: |
          if ls bin/*.apk 2>/dev/null; then
            echo "BUILD BERHASIL!"
            ls -lh bin/*.apk
          else
            echo "APK tidak ditemukan!"
            echo "=== 50 baris terakhir log ==="
            tail -50 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload log build (untuk debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Buat GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VPN Client Build #${{ github.run_number }}"
          files: bin/*.apk
          body: |
            ## 📱 VPN Client APK
            Build dari commit: `${{ github.sha }}`

            **Cara install:**
            1. Download APK di bawah
            2. Aktifkan instalasi dari sumber tidak dikenal
            3. Install & buka app!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
