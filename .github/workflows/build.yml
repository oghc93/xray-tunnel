name: Build VPN Client APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev curl jq

      # ============================================================
      # AUTO-DOWNLOAD XRAY BINARY (tidak perlu upload ke GitHub)
      # Otomatis ambil versi terbaru dari xray-core releases
      # ============================================================
      - name: Download Xray binary (ARM64 for Android)
        run: |
          echo "Mencari versi xray terbaru..."
          LATEST=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)
          echo "Versi xray: $LATEST"

          mkdir -p assets
          curl -L -o /tmp/xray-android.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-android-arm64-v8a.zip"

          unzip -o /tmp/xray-android.zip xray -d assets/
          chmod +x assets/xray
          ls -lh assets/xray
          echo "Xray binary siap!"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: pip install buildozer cython

      - name: Build APK
        run: buildozer -v android debug 2>&1 | tail -80
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-client-apk
          path: bin/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VPN Client v1.0 Build #${{ github.run_number }}"
          files: bin/*.apk
          body: |
            ## VPN Client APK

            Build otomatis dari commit: `${{ github.sha }}`

            ### Cara Install:
            1. Download file `.apk` di bawah
            2. Aktifkan "Izinkan dari sumber tidak dikenal" di HP
            3. Install APK
            4. Buka app → tambah profil → konek!

            > Xray binary: otomatis didownload saat build (tidak perlu upload manual)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
